<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Me | Your Name</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="container">
      <a href="index.html" class="logo">Jian Carlo<span> Yumang</span></a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="contact.html" class="active">Contact Me</a></li>
      </ul>
      <button class="menu-btn" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="page-hero">
    <div class="container">
      <h1>Contact <span class="accent">Me</span></h1>
      <p>Have a project in mind? Send me a message.</p>
    </div>
  </div>

  <section>
    <div class="container contact-grid">
      <div class="contact-info reveal">
        <div class="info-box"><div class="ico">✉</div><div><small>Email</small>jiancarloyumang22@gmail.com</div></div>
        <div class="info-box"><div class="ico">☏</div><div><small>Phone</small>+63 997 446 9037</div></div>
        <div class="info-box"><div class="ico">⚲</div><div><small>Location</small>Pampanga, Philippines</div></div>
      </div>

      <form class="form reveal" id="contact-form">
        <label>Your Name
          <input type="text" name="name" required placeholder="Juan Dela Cruz" />
        </label>
        <label>Your Email
          <input type="email" name="email" required placeholder="you@email.com" />
        </label>
        <label>Subject
          <input type="text" name="subject" placeholder="What is this about?" />
        </label>
        <label>Message
          <textarea name="message" required placeholder="Tell me about your project…"></textarea>
        </label>
        <button class="btn btn-primary" type="submit">Send Message</button>
        <div class="form-msg" id="form-msg"></div>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <div class="socials">
        <a href="https://www.facebook.com/jiancarlo.yumangii.1" aria-label="Facebook">Fb</a>
        <a href="https://github.com/Ziankazu" aria-label="GitHub">Git</a>
        <a href="https://ph.linkedin.com/in/jian-carlo-yumang-34918139b" aria-label="LinkedIn">In</a>
      </div>
      © <span class="year"></span> Jian Carlo Yumang. All rights reserved.
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
